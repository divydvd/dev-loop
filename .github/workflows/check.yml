name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check.mjs
      - run: node --test scripts/device-handoff.test.mjs
      - run: node --test scripts/branch-maintenance.test.mjs
      - run: node --test tools/work-ledger/*.test.mjs
