name: check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/check.mjs
      - run: node --test scripts/device-handoff.test.mjs
      - run: node --test scripts/branch-maintenance.test.mjs
      - run: node --test scripts/independent-review.test.mjs
      - run: node --test scripts/prepare-review-panel.test.mjs
      - run: node --test scripts/testing-contract.test.mjs
      - run: node --test scripts/scan-flow-drift.test.mjs
      - run: node --test scripts/collect-metrics.test.mjs
      - run: node --test scripts/mine-pr-evidence.test.mjs
      - run: node --test scripts/run-benchmark.test.mjs
      - run: node --test scripts/portability-contract.test.mjs
      - run: node --test scripts/release.test.mjs
      - run: node --test tools/work-ledger/*.test.mjs
  release:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: dev-loop-release
      cancel-in-progress: false
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/release.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
